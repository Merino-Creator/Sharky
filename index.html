<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharky</title>

    <link rel="icon" type="image/x-icon" href="./assets/1.Sharkie/3.Swim/1.png">

    <link rel="stylesheet" href="./style/style.css">
</head>

<body onload="init()">

    <h1 id="pageTitle">Sharky</h1>

    <div id="canvas-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="canvasButtons">
            <button id="muteBtn" onclick="toggleMute()">🔊</button>
        </div>

        <div id="hud">
            <div class="dpad">
                <div></div>
                <button id="btnUp"></button>
                <div></div>
                <button id="btnLeft"></button>
                <div></div>
                <button id="btnRight"></button>
                <div></div>
                <button id="btnDown"></button>
                <div></div>
            </div>
            <div class="panel">
                <button id="btnShoot"></button>
                <button id="btnSlap"></button>
            </div>
        </div>
    </div>

    <div id="controls">
        <div class="arrows">
            <img class="controls-image" src='./assets/6.Botones/Key/arrow keys.png'>
            <h3>Move Shark</h3>
        </div>
        <div class="shoot-attack">
            <img class="controls-image" src='./assets/6.Botones/Key/S key.png'>
            <h3>Shoot</h3>
        </div>
        <div class="slap-attack">
            <img class="controls-image" src='./assets/6.Botones/Key/D key.png'>
            <h3>Slap</h3>
        </div>
    </div>

    <div id="policyOverlay" onclick="closeOverlay()">
        <div id="policyContent" onclick="event.stopPropagation()"></div>
    </div>

    <div id="introOverlay" onclick="closeOverlay()">
        <div id="introContent" onclick="event.stopPropagation()"></div>
    </div>

    <div id="rotate-overlay">
        <h2>Please rotate your device to play!</h2>
    </div>

</body>

<script src="./templates/intro-overlay-template.js"></script>
<script src="./templates/policy-overlay-template.js"></script>
<script src="./models/drawable-object.class.js"></script>
<script src="./models/moveable-object.class.js"></script>
<script src="./models/statusbar.class.js"></script>
<script src="./models/keyboard.class.js"></script>
<script src="./models/background-object.class.js"></script>
<script src="./models/character.class.js"></script>
<script src="./models/poison-bottle.class.js"></script>
<script src="./models/coins.class.js"></script>
<script src="./models/pufferFish.class.js"></script>
<script src="./models/jellyfish.class.js"></script>
<script src="./models/light.class.js"></script>
<script src="./models/endboss.class.js"></script>
<script src="./models/bubble.class.js"></script>
<script src="./models/toxic-bubble.class.js"></script>
<script src="./models/level.class.js"></script>
<script src="./levels/level1.js"></script>
<script src="./models/world.class.js"></script>
<script src="./JavaScript/startScreen.js"></script>
<script src="./JavaScript/winLooseScreen.js"></script>
<script src="./JavaScript/game.js"></script>

</html>
