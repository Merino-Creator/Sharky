<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharky</title>

    <link rel="icon" type="image/x-icon" href="/assets/1.Sharkie/3.Swim/1.png">

    <link rel="stylesheet" href="./style/style.css">
</head>

<body onload="init()">

    <h1>Sharky</h1>

    <canvas id="canvas" width="720" height="480" style="background-color: black;"></canvas>

    <div id="controls">
        <div class="arrows">
            <img class="controls-image" src='/assets/6.Botones/Key/arrow keys.png'>
            <h3>Move Shark</h3>
        </div>
        <div class="attack-buttons">
            <div class="shoot-attack">
                <img class="controls-image" src='/assets/6.Botones/Key/S key.png'>
                <h3>Shoot</h3>
            </div>
            <div class="slap-attack">
                <img class="controls-image" src='/assets/6.Botones/Key/D key.png'>
                <h3>Slap</h3>
            </div>
        </div>
    </div>

</body>
